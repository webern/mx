name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a newer push supersedes it. The group is keyed
# on the ref, so a new push to a PR cancels that PR's prior run without
# touching other PRs or master. Limited to pull_request events: each master
# push still runs to completion rather than aborting mid-build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin the Docker build-volume name so CI's bind-backed "mx-build" volume
# (created per-job below) is the one the Makefile actually mounts. Without
# this the Makefile computes a CURDIR-hashed name (for worktree isolation)
# that doesn't match the pre-created volume.
env:
  DOCKER_VOLUME: mx-build

# Every Linux job runs its make targets inside the pinned mx-sdk Docker
# toolchain; only the two macOS jobs build natively.
jobs:
  # Cheap up-front diff check so the gen-quality gate (score.json/report.md,
  # ratcheted floor) only runs -- and only spends a PR comment -- when gen/
  # actually changed. A gen/ change that's md-only (README/AGENTS/DESIGN docs)
  # doesn't move the score, so it's excluded too. Other linux-gen steps
  # (fmt-check, test-gen, gen-check, regen drift) are unaffected: they're
  # cheap and apply to the whole repo, not just gen/.
  changes:
    name: "Detect gen/ changes"
    runs-on: ubuntu-latest
    outputs:
      gen: ${{ steps.filter.outputs.gen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gen:
              - 'gen/**'
              - '!gen/**/*.md'

  # Python-side gates for the gen/ generator and audit tool, plus the repo's
  # only clang-format gate. Also runs plates --check for every target. No C++
  # is compiled or tested here.
  linux-gen:
    name: "gen: unit/audit tests + regen drift + quality/lint + fmt-check (Linux)"
    runs-on: ubuntu-latest
    needs: changes

    # Read-only token: this job builds untrusted fork PR code, so it never
    # requests write. The gen-quality comment is posted by the pr-comment.yaml
    # companion workflow (workflow_run) from the base-repo context instead.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Container-driver builder (needed to export the gha layer cache) plus
      # the runtime-token export so the Makefile auto-detects
      # ACTIONS_RUNTIME_TOKEN and pushes/pulls the Docker layer cache. Keeps
      # the toolchain-install layer warm across runs. The same `make check`
      # runs locally with no cache (token absent -> plain build).
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      # Back the mx-build volume with a workspace path so actions/cache can
      # persist the ccache dir it holds. Not circular: Docker resolves this
      # backing dir host-side, and the volume shadows /workspace/build inside
      # the container.
      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/docker/.ccache
          key: ccache-${{ runner.os }}-gen-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-gen-

      - name: fmt-check (clang-format, all C++ under src/)
        run: make check

      - name: gen unit tests (parser/IR/plates/press)
        run: make test-gen

      - name: audit tool unit tests (incl. failure classifier)
        run: make test-audit

      - name: plates --check (all targets)
        run: make gen-check

      # The committed generated output must match the generator: regenerate
      # every target, then any tracked-file drift fails the build.
      - name: Regenerate all targets
        run: make gen

      - name: Generated output drift check
        run: git diff --exit-code

      # Static-analysis gates on the gen/ generator. gen-quality only runs when
      # gen/ actually changed (see the `changes` job); gen-lint stays unguarded
      # since it's cheap and has no report/comment plumbing riding on it. Each
      # fails the build below its floor (GEN_QUALITY_FLOOR / GEN_LINT_FLOOR in
      # the Makefile).
      - name: gen-quality gate
        if: needs.changes.outputs.gen == 'true'
        run: make gen-quality

      - name: gen-lint gate
        run: make gen-lint

      # Surface the score in the run summary when the gate actually ran.
      # always() so a gate failure still reports why; skipped runs (gen/
      # unchanged) leave this section out entirely rather than printing a
      # misleading "(no report produced)".
      - name: gen-quality report
        if: always() && needs.changes.outputs.gen == 'true'
        run: |
          {
            echo '### gen-quality `gen/`'
            echo ''
            cat data/testOutput/gen-quality/report.md 2>/dev/null || echo '(no report produced)'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs run with a read-only token, so this job can't post the comment
      # itself. Stage the body + PR number as an artifact; pr-comment.yaml posts
      # it after CI completes. always() so a gate failure still reports why.
      # Guarded on the report file existing (not just needs.changes.outputs.gen)
      # so the comment-sending job gets no artifact -- and gracefully posts
      # nothing -- whenever gen-quality didn't run or crashed before writing it.
      - name: Stage gen-quality PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f data/testOutput/gen-quality/report.md ]; then
            echo 'No gen-quality report to stage (check skipped or produced nothing).'
            exit 0
          fi
          mkdir -p pr-comment
          {
            echo '### gen-quality `gen/`'
            echo ''
            cat data/testOutput/gen-quality/report.md
            echo ''
            echo 'Commit `${{ github.sha }}`.'
          } > pr-comment/body.md
          echo '${{ github.event.pull_request.number }}' > pr-comment/number

      - name: Upload gen-quality PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-gen
          path: pr-comment/
          if-no-files-found: ignore

  # The mx::api/mx::impl product surface. Core-layer suites (corert, unit,
  # xmllint, probes) run in linux-core, not here.
  linux-api:
    name: "api: mxtest suite + examples + corpus round-trip (Linux)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/docker/.ccache
          key: ccache-${{ runner.os }}-api-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-api-

      - name: Build mx library
        run: make lib

      - name: mxtest suite (api/impl/file/control) + examples
        run: make test

      - name: api corpus round-trip (regression mode)
        run: make test-api-roundtrip

  # The strongly-typed mx::core layer. Note: check-core-dev (warning-free
  # build gate) is a local-only gate; CI does not run it.
  linux-core:
    name: "core: corert round-trip + unit + xmllint + compile probes (Linux)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/docker/.ccache
          key: ccache-${{ runner.os }}-core-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-core-

      # corert file counts are pinned by an in-suite counts case (see CoreRoundtripTest.cpp).
      - name: corert round-trip suite
        run: make test-core-dev

      - name: mx::core unit tests
        run: make test-cpp-unit

      - name: validate-cpp (serialize corpus + xmllint vs XSD)
        run: make validate-cpp

      - name: probe-cpp (must-not-compile probes)
        run: make probe-cpp

  # corert round-trip suites for the generator's emitted Go and C targets.
  linux-targets:
    name: "corert: Go + C generated targets (Linux)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Go corert suite
        run: make test-go

      - name: C corert suite
        run: make test-c

  # Re-runs the core (corert + unit) and api (mxtest + round-trip) suites in
  # instrumented builds to produce gcovr reports. Coverage % is advisory (no
  # floor), but a test failure still fails the job. Split into two jobs so the
  # two instrumented builds run in parallel instead of as serial steps in one
  # job; coverage-report merges their outputs into a single job summary +
  # PR comment once both finish.
  coverage-core:
    name: "coverage: core gcovr report, advisory (Linux)"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      table: ${{ steps.table.outputs.table }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v4

      # Same container-driver + runtime-token setup as linux-gen so the
      # coverage stage reuses the warm toolchain layer cache.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      # Bind-back mx-build so its ccache dir is cacheable, as in linux-gen. A
      # distinct key prefix keeps this job's save from racing the others.
      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/docker/.ccache
          key: ccache-${{ runner.os }}-coverage-core-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-coverage-core-

      - name: coverage-core-dev (corert + unit, instrumented)
        run: make coverage-core-dev

      # Turn gcovr's 3-line summary (data/testOutput/coverage/summary.txt, e.g.
      # "lines: 52.1% (17624 out of 33846)") into a Markdown table for the job
      # summary, and pass it to coverage-report as a job output for the
      # merged PR comment.
      - name: Build coverage table
        id: table
        if: always()
        run: |
          make_table() {
            local file="$1"
            echo '| Metric | Coverage | Covered / Total |'
            echo '|---|---:|---:|'
            awk '/^(lines|functions|branches):/ {
              m=$1; sub(":","",m);
              c=$3; sub("[(]","",c);
              t=$6; sub("[)]","",t);
              M=toupper(substr(m,1,1)) substr(m,2);
              printf "| %s | %s | %s / %s |\n", M, $2, c, t
            }' "$file"
          }
          {
            echo '### Core-dev coverage `src/private/mx/core/`'
            echo ''
            make_table data/testOutput/coverage/summary.txt
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'table<<COVERAGE_TABLE_EOF'
            cat table.md
            echo 'COVERAGE_TABLE_EOF'
          } >> "$GITHUB_OUTPUT"

      # Single self-contained page, stored (compression-level 0). GitHub still
      # delivers artifacts as a .zip -- there is no raw-file download -- so the
      # zip just holds one index.html to unzip and open.
      - name: Upload core HTML report
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-dev
          path: data/testOutput/coverage/index.html
          compression-level: 0

  coverage-api:
    name: "coverage: api gcovr report, advisory (Linux)"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      table: ${{ steps.table.outputs.table }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Create bind-backed build volume
        run: |
          mkdir -p build/docker
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/build/docker" mx-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/docker/.ccache
          key: ccache-${{ runner.os }}-coverage-api-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-coverage-api-

      - name: coverage-api (mxtest + round-trip, instrumented)
        run: make coverage-api

      - name: Build coverage table
        id: table
        if: always()
        run: |
          make_table() {
            local file="$1"
            echo '| Metric | Coverage | Covered / Total |'
            echo '|---|---:|---:|'
            awk '/^(lines|functions|branches):/ {
              m=$1; sub(":","",m);
              c=$3; sub("[(]","",c);
              t=$6; sub("[)]","",t);
              M=toupper(substr(m,1,1)) substr(m,2);
              printf "| %s | %s | %s / %s |\n", M, $2, c, t
            }' "$file"
          }
          {
            echo '### API coverage `src/private/mx/{api,impl,utility}/`'
            echo ''
            make_table data/testOutput/coverage/api/summary.txt 2>/dev/null || echo '(api coverage not produced)'
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'table<<COVERAGE_TABLE_EOF'
            cat table.md
            echo 'COVERAGE_TABLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload api HTML report
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: data/testOutput/coverage/api/index.html
          compression-level: 0

  # Merges the two coverage jobs' tables into one PR comment. always() so it
  # still posts (with whatever tables it has) if one side failed; gated to
  # pull_request since push events have no PR to comment on.
  coverage-report:
    name: "coverage: PR comment (core + api)"
    runs-on: ubuntu-latest
    needs: [coverage-core, coverage-api]
    if: always() && github.event_name == 'pull_request'

    # Read-only token: posting the coverage comment is delegated to the
    # pr-comment.yaml companion workflow so fork PRs get a comment too (their
    # GITHUB_TOKEN is capped to read-only here).
    permissions:
      contents: read

    steps:
      # Stage the body + PR number as an artifact; pr-comment.yaml posts it
      # after CI completes (this job's fork-PR token is read-only). It posts a
      # fresh comment each run, so the PR keeps a per-push coverage history.
      - name: Stage PR comment
        run: |
          mkdir -p pr-comment
          {
            echo '### Coverage report'
            echo ''
            echo '${{ needs.coverage-core.outputs.table }}'
            echo ''
            echo '${{ needs.coverage-api.outputs.table }}'
            echo ''
            echo '[Core HTML report](${{ needs.coverage-core.outputs.artifact-url }}) | [API HTML report](${{ needs.coverage-api.outputs.artifact-url }})'
            echo ''
            echo 'Commit `${{ github.sha }}`.'
          } > pr-comment/body.md
          echo '${{ github.event.pull_request.number }}' > pr-comment/number

      - name: Upload PR comment
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-coverage
          path: pr-comment/

  # Skips validate-cpp (xmllint) and probe-cpp; those run Linux-only in
  # linux-core. No gen/audit gates here either.
  macos:
    name: "core + api: corert + unit + mxtest + round-trip (macOS/AppleClang)"
    runs-on: macos-latest

    # No Docker on the macOS runners: MX_RUNNING_IN_DOCKER=1 flips the
    # Makefile to its direct-invocation branch so the build runs natively
    # with AppleClang. This is the only C++ job off the pinned toolchain,
    # by design: it exists to find (and keep finding) AppleClang fallout.
    env:
      MX_RUNNING_IN_DOCKER: 1

    steps:
      - uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-core-dev-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-core-dev-

      - name: corert round-trip suite
        run: make test-core-dev

      - name: mx::core unit tests
        run: make test-cpp-unit

      - name: Build mx library (api/impl)
        run: make lib

      - name: mxtest suite (api/impl/file/control) + examples
        run: make test

      - name: api corpus round-trip (regression mode)
        run: make test-api-roundtrip

  swift-local:
    name: "swift: Mx package build only (macOS/SPM)"
    runs-on: macos-latest

    # By default mx builds `Mx` as a source library straight from this checkout --
    # the path komp takes when it depends on a sibling mx via `.package(path:)`.
    # Building it here proves mx compiles as a Swift package under AppleClang/SPM on
    # every PR; it runs no test suites. The binary xcframework release arm
    # (MX_BINARY_RELEASE) is follow-up work.

    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Build the Mx Swift package (local-checkout source mode)
        run: swift build --product Mx
