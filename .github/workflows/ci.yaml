name: CI

on:
  pull_request:
  push:
    branches: [master, newgen]

# Clean-slate spike: the generated library and the generator were removed (see
# AGENTS.md). Until the generator is rebuilt, CI only exercises what survives --
# the mx-sdk fmt gate and the ezxml structural layer. The corert binary is
# expected not to build yet (it needs mx/core), so it is not gated here.
jobs:
  gate:
    name: fmt + ezxml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fmt-check (mx-sdk)
        run: make check
      - name: Build ezxml
        run: make ezxml
