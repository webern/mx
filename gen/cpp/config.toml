# Default values for specific elements (keyed by element name).
[defaults.element]
type = "NoteTypeValue::quarter"
duration = "1.0"
tremolo = "3"
metronome-relation = '"equals"'

# Attribute structs that preserve xmlns:* namespace declarations through
# round-trip (e.g. xmlns:xlink on score-partwise).
[overrides]
xmlns_preserving_attrs = [
    "ScorePartwiseAttributes",
    "ScoreTimewiseAttributes",
    "OpusAttributes",
    "LinkAttributes",
]

# Elements whose hasContents() should always return true.
has_contents_always_true = ["measure-layout"]

# Per-(parent-element, child-element) ctor argument overrides.
[overrides.child_init_value.scaling]
millimeters = "MillimetersValue(7)"
tenths = "TenthsValue(40)"

[overrides.child_init_value.staff-details]
staff-lines = "NonNegativeInteger(5)"

# Per-attribute default value overrides, keyed by attrs struct name then field.
[overrides.attr_default.AccidentalTextAttributes]
lang = '"it"'

[overrides.attr_default.DirectiveAttributes]
lang = '"it"'

[overrides.attr_default.LyricAttributes]
justify = "LeftCenterRight::center"

[overrides.attr_default.ScorePartwiseAttributes]
version = '"3.0"'

[overrides.attr_default.ScoreTimewiseAttributes]
version = '"3.0"'

[overrides.attr_default.WordsAttributes]
lang = '"it"'

[overrides.attr_default.TextAttributes]
lang = '"it"'

[overrides.attr_default.RehearsalAttributes]
lang = '"it"'

[overrides.attr_default.LyricLanguageAttributes]
lang = '"it"'

[overrides.attr_default.CreditWordsAttributes]
lang = '"it"'

[overrides.attr_default.BracketAttributes]
lineEnd = "LineEnd::down"

[overrides.attr_default.NoteSizeAttributes]
type = "NoteSizeType::large"

[overrides.attr_default.EndingAttributes]
number = '"1"'

[overrides.attr_default.GroupingAttributes]
number = 'XsToken("1")'

[overrides.attr_default.PageMarginsAttributes]
type = "MarginType::both"

[overrides.attr_default.LinkAttributes]
show = "XlinkShow::replace"

[overrides.attr_default.OtherAppearanceAttributes]
type = '"undefined"'

[overrides.attr_default.OtherNotationAttributes]
type = "StartStopSingle::start"

[overrides.attr_default.OtherOrnamentAttributes]
placement = "AboveBelow::above"

[overrides.attr_default.OtherTechnicalAttributes]
placement = "AboveBelow::above"

[overrides.attr_default.PrincipalVoiceAttributes]
symbol = "PrincipalVoiceSymbol::none"

[overrides.attr_default.StringMuteAttributes]
type = "OnOff::on"

[overrides.attr_default.PartGroupAttributes]
number = 'XsToken("1")'

[overrides.attr_default.MetronomeAttributes]
halign = "LeftCenterRight::center"
justify = "LeftCenterRight::center"

# Score wrapper (partwise/timewise) per-flavor behavioral knobs.
[score_wrapper.score-partwise]
outer_extra_includes = []
outer_loop_uses_end_var = false
music_data_holder_attrs_jit = true
music_data_holder_debug_throw = true
set_holder_clear_repushes_default = true
set_holder_remove_has_size_guard = true
set_holder_post_loop_required = false
set_holder_first_flag_name = "isFirstAdded"
set_holder_use_return_macro = true
set_holder_loop_uses_element_name_var = false
set_holder_unexpected_order = "message_first"
set_holder_unexpected_msg = "encountered_quoted"
set_holder_begin_deref_parens = false
set_holder_from_x_before_first_check = true
set_holder_blank_after_first_decl = false
set_holder_blank_inside_else = false
set_holder_child_var_source = "xml_name"

[score_wrapper.score-timewise]
outer_extra_includes = ["ezxml/XElement.h", "ezxml/XElementIterator.h"]
outer_loop_uses_end_var = true
music_data_holder_attrs_jit = false
music_data_holder_debug_throw = false
set_holder_clear_repushes_default = false
set_holder_remove_has_size_guard = false
set_holder_post_loop_required = true
set_holder_first_flag_name = "isFirstTimewisePartFound"
set_holder_use_return_macro = false
set_holder_loop_uses_element_name_var = true
set_holder_unexpected_order = "issuccess_first"
set_holder_unexpected_msg = "trailing_encountered"
set_holder_begin_deref_parens = true
set_holder_from_x_before_first_check = true
set_holder_blank_after_first_decl = true
set_holder_blank_inside_else = true
set_holder_child_var_source = "class_name"
