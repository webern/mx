# Element dispatch configuration.
[elements]
# File stems to always overwrite (even if file already exists).
overwrite_file_stems = ["Direction", "DirectionType", "DirectionAttributes"]
# Elements skipped entirely during generation.
skip = []
# Elements owned by bespoke family emitters (not generated standalone).
bespoke_family_owned = ["part", "measure"]
# Elements handled by tree-based generation path.
tree = [
    "bend", "group-abbreviation-display", "group-name-display", "harmonic",
    "key", "metronome", "notations", "notehead-text", "ornaments",
    "part-abbreviation-display", "part-name-display", "play",
    "score-instrument",
]

# Class name overrides (element-name -> C++ class name).
[elements.class_name_override]
attributes = "Properties"

# Value type overrides for specific elements.
[elements.value_type_override.instrument-sound]
cpp_type = "PlaybackSoundType"
header = "mx/core/PlaybackSoundType.h"
default = "PlaybackSoundType{}"

# Group structural configuration.
[groups]
# Groups that get a real fromXElementImpl body (not the UNUSED stub).
real_from_x = ["score-header", "arrow"]
# Groups to generate (the subset of XSD groups we emit classes for).
generate = [
    "beat-unit", "display-step-octave", "editorial", "editorial-voice",
    "editorial-voice-direction", "layout", "score-header",
]
# Complex types using wrapping (forEachChild) streamContents.
wrapping_streamcontents = [
    "defaults", "grouping", "identification", "part-group", "print",
]
# Element names triggering extra importGroup call in unbounded-group parsing.
unbounded_import_group_after = ["midi-instrument"]

# Opt-in: type -> synthetic group ref name for nested optional sequences.
[groups.nested_optional_as_group]
time-modification = "normal-type-normal-dot"

# Opt-in: type -> synthetic group ref for unbounded sequences.
[groups.unbounded_as_group]
score-part = "midi-device-instrument"

# Opt-in: extending type -> base group -> renamed wrapper group.
[groups.extension_rename.metronome-tuplet]
normal-type-normal-dot = "time-modification-normal-type-normal-dot"

[categories.simple-value]
header_template = "simple_value_h.j2"
impl_template = "simple_value_cpp.j2"

[categories.attrs]
header_template = "attrs_h.j2"
impl_template = "attrs_cpp.j2"

[categories.group]
header_template = "group_h.j2"
impl_template = "group_cpp.j2"

# Default constructor values for C++ attribute types (used in Attributes structs).
[defaults.attr_type]
FontStyle = "FontStyle::normal"
FontWeight = "FontWeight::normal"
AboveBelow = "AboveBelow::below"
Valign = "Valign::bottom"
ValignImage = "ValignImage::bottom"
LeftCenterRight = "LeftCenterRight::left"
EnclosureShape = "EnclosureShape::none"
YesNo = "YesNo::no"
OnOff = "OnOff::off"
FontSize = "CssFontSize::medium"
StartStop = "StartStop::start"
StartStopContinue = "StartStopContinue::start"
StartStopSingle = "StartStopSingle::single"
LineType = "LineType::solid"
LineShape = "LineShape::straight"
SymbolSize = "SymbolSize::full"

# Default constructor values for element value types (e.g. enums).
[defaults.value_type]
AccidentalValue = "AccidentalValue::natural"
ArrowDirectionEnum = "ArrowDirectionEnum::up"
ArrowStyleEnum = "ArrowStyleEnum::single"
BarStyleEnum = "BarStyleEnum::regular"
BeamValue = "BeamValue::begin"
BeaterValue = "BeaterValue::snareStick"
BreathMarkValue = "BreathMarkValue::emptystring"
CircularArrowEnum = "CircularArrowEnum::clockwise"
ClefSign = "ClefSign::g"
DegreeTypeValue = "DegreeTypeValue::add"
EffectEnum = "EffectEnum::anvil"
FermataShape = "FermataShape::normal"
GlassEnum = "GlassEnum::windChimes"
GroupBarlineValue = "GroupBarlineValue::yes"
GroupSymbolValue = "GroupSymbolValue::none"
HandbellValue = "HandbellValue::damp"
HoleClosedValue = "HoleClosedValue::no"
KindValue = "KindValue::none"
MeasureNumberingValue = "MeasureNumberingValue::none"
MembraneEnum = "MembraneEnum::snareDrum"
MetalEnum = "MetalEnum::bell"
MuteEnum = "MuteEnum::off"
NoteTypeValue = "NoteTypeValue::eighth"
NoteheadValue = "NoteheadValue::normal"
PitchedEnum = "PitchedEnum::xylophone"
SemiPitchedEnum = "SemiPitchedEnum::medium"
StaffTypeEnum = "StaffTypeEnum::regular"
StemValue = "StemValue::none"
StepEnum = "StepEnum::a"
StickLocationEnum = "StickLocationEnum::center"
StickMaterialEnum = "StickMaterialEnum::medium"
StickTypeEnum = "StickTypeEnum::yarn"
SyllabicEnum = "SyllabicEnum::begin"
TimeRelationEnum = "TimeRelationEnum::equals"
WoodEnum = "WoodEnum::claves"
PlaybackSound = "PlaybackSound::keyboardPiano"

# Default values for specific elements (keyed by element name).
[defaults.element]
type = "NoteTypeValue::quarter"
duration = "1.0"
tremolo = "3"
metronome-relation = '"equals"'

# Attribute struct naming configuration.
[attrs]
# Attribute structs at the core root level (not in elements/).
core_root = ["EmptyPrintObjectStyleAlignAttributes"]
# Shared attrs in elements/ reused across multiple elements.
shared = [
    "EmptyPlacementAttributes",
    "EmptyLineAttributes",
    "EmptyTrillSoundAttributes",
    "EmptyFontAttributes",
    "EmptyPrintStyleAlignAttributes",
]

# XSD type name aliases for attribute-struct naming purposes.
[attrs.type_alias]
empty-print-style-align = "empty-print-object-style-align"

# Attribute structs that preserve xmlns:* namespace declarations through
# round-trip (e.g. xmlns:xlink on score-partwise).
[overrides]
xmlns_preserving_attrs = [
    "ScorePartwiseAttributes",
    "ScoreTimewiseAttributes",
    "OpusAttributes",
    "LinkAttributes",
]

# Elements whose hasContents() should always return true.
has_contents_always_true = ["measure-layout"]

# Per-(parent-element, child-element) ctor argument overrides.
[overrides.child_init_value.scaling]
millimeters = "MillimetersValue(7)"
tenths = "TenthsValue(40)"

[overrides.child_init_value.staff-details]
staff-lines = "NonNegativeInteger(5)"

# Per-attribute default value overrides, keyed by attrs struct name then field.
[overrides.attr_default.AccidentalTextAttributes]
lang = '"it"'

[overrides.attr_default.DirectiveAttributes]
lang = '"it"'

[overrides.attr_default.LyricAttributes]
justify = "LeftCenterRight::center"

[overrides.attr_default.ScorePartwiseAttributes]
version = '"3.0"'

[overrides.attr_default.ScoreTimewiseAttributes]
version = '"3.0"'

[overrides.attr_default.WordsAttributes]
lang = '"it"'

[overrides.attr_default.TextAttributes]
lang = '"it"'

[overrides.attr_default.RehearsalAttributes]
lang = '"it"'

[overrides.attr_default.LyricLanguageAttributes]
lang = '"it"'

[overrides.attr_default.CreditWordsAttributes]
lang = '"it"'

[overrides.attr_default.BracketAttributes]
lineEnd = "LineEnd::down"

[overrides.attr_default.NoteSizeAttributes]
type = "NoteSizeType::large"

[overrides.attr_default.EndingAttributes]
number = '"1"'

[overrides.attr_default.GroupingAttributes]
number = 'XsToken("1")'

[overrides.attr_default.PageMarginsAttributes]
type = "MarginType::both"

[overrides.attr_default.LinkAttributes]
show = "XlinkShow::replace"

[overrides.attr_default.OtherAppearanceAttributes]
type = '"undefined"'

[overrides.attr_default.OtherNotationAttributes]
type = "StartStopSingle::start"

[overrides.attr_default.OtherOrnamentAttributes]
placement = "AboveBelow::above"

[overrides.attr_default.OtherTechnicalAttributes]
placement = "AboveBelow::above"

[overrides.attr_default.PrincipalVoiceAttributes]
symbol = "PrincipalVoiceSymbol::none"

[overrides.attr_default.StringMuteAttributes]
type = "OnOff::on"

[overrides.attr_default.PartGroupAttributes]
number = 'XsToken("1")'

[overrides.attr_default.MetronomeAttributes]
halign = "LeftCenterRight::center"
justify = "LeftCenterRight::center"

# Score wrapper (partwise/timewise) per-flavor behavioral knobs.
[score_wrapper.score-partwise]
outer_extra_includes = []
outer_loop_uses_end_var = false
music_data_holder_attrs_jit = true
music_data_holder_debug_throw = true
set_holder_clear_repushes_default = true
set_holder_remove_has_size_guard = true
set_holder_post_loop_required = false
set_holder_first_flag_name = "isFirstAdded"
set_holder_use_return_macro = true
set_holder_loop_uses_element_name_var = false
set_holder_unexpected_order = "message_first"
set_holder_unexpected_msg = "encountered_quoted"
set_holder_begin_deref_parens = false
set_holder_from_x_before_first_check = true
set_holder_blank_after_first_decl = false
set_holder_blank_inside_else = false
set_holder_child_var_source = "xml_name"

[score_wrapper.score-timewise]
outer_extra_includes = ["ezxml/XElement.h", "ezxml/XElementIterator.h"]
outer_loop_uses_end_var = true
music_data_holder_attrs_jit = false
music_data_holder_debug_throw = false
set_holder_clear_repushes_default = false
set_holder_remove_has_size_guard = false
set_holder_post_loop_required = true
set_holder_first_flag_name = "isFirstTimewisePartFound"
set_holder_use_return_macro = false
set_holder_loop_uses_element_name_var = true
set_holder_unexpected_order = "issuccess_first"
set_holder_unexpected_msg = "trailing_encountered"
set_holder_begin_deref_parens = true
set_holder_from_x_before_first_check = true
set_holder_blank_after_first_decl = true
set_holder_blank_inside_else = true
set_holder_child_var_source = "class_name"
