[categories.simple-value]
header_template = "simple_value_h.j2"
impl_template = "simple_value_cpp.j2"

[categories.attrs]
header_template = "attrs_h.j2"
impl_template = "attrs_cpp.j2"

[categories.group]
header_template = "group_h.j2"
impl_template = "group_cpp.j2"

# Default constructor values for C++ attribute types (used in Attributes structs).
[defaults.attr_type]
FontStyle = "FontStyle::normal"
FontWeight = "FontWeight::normal"
AboveBelow = "AboveBelow::below"
Valign = "Valign::bottom"
ValignImage = "ValignImage::bottom"
